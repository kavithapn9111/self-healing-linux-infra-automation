# Main settings for the self-healing monitor.
# Values can also be overridden with environment variables.

# How often monitor_loop.sh runs checks.
INTERVAL_SECONDS=60

# Maximum restart attempts before sending an alert.
MAX_RETRIES=3

# Seconds to wait after restarting a service before checking again.
RECOVERY_WAIT_SECONDS=5

# System resource alert thresholds.
DISK_THRESHOLD_PERCENT=80
MEMORY_THRESHOLD_PERCENT=85
LOAD_THRESHOLD=4

# Optional alert destinations. Leave empty to log alerts only.
ALERT_EMAIL=""
SLACK_WEBHOOK_URL=""

# Leave empty to use project-local defaults:
# logs/monitor.log and state/
LOG_FILE=""
STATE_DIR=""

