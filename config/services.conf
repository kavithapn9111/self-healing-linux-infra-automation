# Format:
# name|check_type|check_target|restart_target|description
#
# check_type options:
# systemd  - check a systemd service using systemctl is-active
# process  - check a process using pgrep
# port     - check a listening TCP port
# http     - check an HTTP endpoint using curl
#
# Edit service names for your Linux distribution.
# Ubuntu often uses ssh and cron.
# RHEL/CentOS often uses sshd and crond.

ssh|systemd|ssh|ssh|SSH remote login service
cron|systemd|cron|cron|Scheduled jobs service

# Optional examples. Uncomment only if these match your machine.
# nginx_http|http|http://localhost|nginx|Local Nginx HTTP health check
# nginx_port|port|80|nginx|Nginx port check
# docker_process|process|dockerd|docker|Docker daemon process check
